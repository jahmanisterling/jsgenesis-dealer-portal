{% extends "portal/base.html" %}
{% block content %}

<h2>Add Review</h2>

<form method="post">
    {% csrf_token %}

    <label class="form-label mt-3">Rating (1–5)</label>
    <input type="number" min="1" max="5" name="rating" class="form-control" required>

    <label class="form-label mt-3">Your Review</label>
    <textarea name="review" class="form-control" required></textarea>

    <button class="btn btn-success mt-4">Submit Review</button>
</form>

{% endblock %}
